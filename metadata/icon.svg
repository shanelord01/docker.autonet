<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="256" height="256">
  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="#0db7ed" />
  
  <!-- Container Hexagon -->
  <polygon points="50,15 80,32 80,68 50,85 20,68 20,32" fill="none" stroke="#ffffff" stroke-width="6" />
  
  <!-- Network Nodes -->
  <circle cx="50" cy="32" r="6" fill="#ffffff" />
  <circle cx="32" cy="62" r="6" fill="#ffffff" />
  <circle cx="68" cy="62" r="6" fill="#ffffff" />
  
  <!-- Connecting Lines -->
  <line x1="50" y1="32" x2="32" y2="62" stroke="#ffffff" stroke-width="4" />
  <line x1="50" y1="32" x2="68" y2="62" stroke="#ffffff" stroke-width="4" />
  <line x1="32" y1="62" x2="68" y2="62" stroke="#ffffff" stroke-width="4" />
</svg>
